[package]
name = "service-sim-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Deterministic HTTP service simulation and transport faults for integration tests"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ulrichheringer/service-sim-rs"
keywords = ["testing", "http", "mock", "fault-injection"]
categories = ["development-tools::testing"]

[dependencies]
httparse = "1.10"
socket2 = "0.6"
tokio = { version = "1.43", features = ["rt", "macros", "net", "io-util", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
